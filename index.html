<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241f1a" />
    <title>Ragged — Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ragged-seams.css" />
    <link rel="stylesheet" href="client-interactions.css" />
  </head>
  <body>
    <div class="client-shell" id="clientShell">
      <aside class="sidebar" id="sidebar" aria-label="Ragged navigation">
        <a class="brand" href="#browser" aria-label="Ragged home"><span class="brand-mark">R</span><span class="brand-name">ragged<span class="brand-period">.</span></span></a>
        <nav class="side-nav" aria-label="Main sections">
          <a class="nav-item" href="#games" data-section="games" title="Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9h11a4.5 4.5 0 0 1 4.42 5.34l-.63 3.15a2.3 2.3 0 0 1-3.82 1.24l-2.1-1.93H8.63l-2.1 1.93a2.3 2.3 0 0 1-3.82-1.24l-.63-3.15A4.5 4.5 0 0 1 6.5 9Z"/><path d="M7 12v4M5 14h4M16.5 13h.01M19 15.5h.01"/></svg><span>Games</span></a>
          <a class="nav-item" href="#ai" data-section="ai" title="AI"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6M2 12h2M20 12h2"/></svg><span>AI</span></a>
          <a class="nav-item active" href="#browser" data-section="browser" title="Browser" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h12M9 21l3-9M15.5 4.2l-3.8 5.1"/><circle cx="12" cy="12" r="2.5"/></svg><span>Browser</span></a>
          <a class="nav-item" href="#settings" data-section="settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg><span>Settings</span></a>
        </nav>
      </aside>

      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true"><span aria-hidden="true">↑</span></button>

      <main class="main-panel">
        <header class="topbar"><div class="breadcrumbs"><span>RAGGED</span><span class="crumb-slash">/</span><strong id="sectionTitle">Browser</strong></div></header>

        <!-- Browser appearance is retained; interactive browser features are intentionally not implemented yet. -->
        <section class="browser-page page-view visible" id="browser" data-view="browser" aria-label="Browser">
          <section class="browser-window" aria-label="Ragged browser mockup">
            <div class="browser-chrome"><div class="browser-tabs"><div class="browser-tab"><span class="tab-favicon">r</span><span>Ragged home</span><span class="tab-close" aria-hidden="true">×</span></div><span class="new-tab" aria-hidden="true">+</span></div><div class="browser-controls"><div class="browser-arrows"><span class="browser-control" aria-hidden="true">‹</span><span class="browser-control" aria-hidden="true">›</span><span class="browser-control" aria-hidden="true">↻</span></div><div class="address-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span>ragged://home</span><span aria-hidden="true">⌕</span></div><span class="browser-control browser-menu" aria-hidden="true">···</span></div></div>
            <div class="browser-content"><div class="welcome-page"><div class="welcome-logo"><span>R</span></div><h2>Welcome to<br /><span>Ragged</span></h2></div></div>
            <div class="browser-status"><span>Ragged Browser</span></div>
          </section>
        </section>

        <section class="games-page page-view" id="games" data-view="games" aria-label="Games library" aria-hidden="true"><div class="section-page-content"><h1>Games</h1><form class="game-form" id="gameForm"><input id="gameName" type="text" placeholder="Game name" aria-label="Game name" required maxlength="60"/><input id="gameUrl" type="url" placeholder="Optional game link" aria-label="Optional game link"/><button type="submit">Add game</button></form><div class="game-library" id="gameLibrary" aria-live="polite"></div></div></section>

        <section class="ai-page page-view" id="ai" data-view="ai" aria-label="Ragged AI" aria-hidden="true"><div class="ai-workspace"><div class="ai-mark" aria-hidden="true">R</div><div class="ai-conversation" id="aiConversation" aria-live="polite" aria-relevant="additions"></div><form class="ai-composer" id="aiForm"><textarea id="aiInput" rows="1" placeholder="Message AI…" aria-label="Message AI" required></textarea><button type="submit" id="aiSend" aria-label="Send message">↑</button></form></div></section>

        <section class="settings-page page-view" id="settings" data-view="settings" aria-label="Settings" aria-hidden="true"><div class="section-page-content"><h1>Settings</h1><label class="setting-row"><span>Keep sidebar open</span><input id="sidebarPreference" type="checkbox" checked/></label><button class="reset-button" id="clearGames" type="button">Clear game library</button></div></section>
      </main>
    </div>
    <script src="ai-config.js"></script>
    <script src="app.js"></script>
    <script src="ai.js"></script>
  </body>
</html>
