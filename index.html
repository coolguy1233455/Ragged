<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#241f1a" />
    <title>Ragged — Client</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ragged-seams.css" />
  </head>
  <body>
    <div class="client-shell">
      <aside class="sidebar" aria-label="Ragged navigation">
        <a class="brand" href="#home" aria-label="Ragged home">
          <span class="brand-mark">R</span>
          <span class="brand-name">ragged<span class="brand-period">.</span></span>
        </a>

        <nav class="side-nav" aria-label="Main sections">
          <a class="nav-item" href="#games" title="Games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9h11a4.5 4.5 0 0 1 4.42 5.34l-.63 3.15a2.3 2.3 0 0 1-3.82 1.24l-2.1-1.93H8.63l-2.1 1.93a2.3 2.3 0 0 1-3.82-1.24l-.63-3.15A4.5 4.5 0 0 1 6.5 9Z"/><path d="M7 12v4M5 14h4M16.5 13h.01M19 15.5h.01"/></svg>
            <span>Games</span>
          </a>
          <a class="nav-item" href="#ai" title="AI">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6M2 12h2M20 12h2"/></svg>
            <span>AI</span>
          </a>
          <a class="nav-item active" href="#browser" title="Browser" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h12M9 21l3-9M15.5 4.2l-3.8 5.1"/><circle cx="12" cy="12" r="2.5"/></svg>
            <span>Browser</span>
          </a>
          <a class="nav-item" href="#settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>
            <span>Settings</span>
          </a>
        </nav>
      </aside>

      <main class="main-panel" id="home">
        <header class="topbar">
          <div class="breadcrumbs"><span>RAGGED</span><span class="crumb-slash">/</span><strong>Browser</strong></div>
          <div class="topbar-right">
            <span class="icon-button notification-button" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span>
          </div>
        </header>

        <section class="browser-page page-view visible" id="browser">
          <section class="browser-window" aria-label="Ragged browser mockup">
            <div class="browser-chrome">
              <div class="browser-tabs">
                <div class="browser-tab"><span class="tab-favicon">r</span><span>Ragged home</span><span class="tab-close" aria-hidden="true">×</span></div>
                <span class="new-tab" aria-hidden="true">+</span>
              </div>
              <div class="browser-controls">
                <div class="browser-arrows"><span class="browser-control" aria-hidden="true">‹</span><span class="browser-control" aria-hidden="true">›</span><span class="browser-control" aria-hidden="true">↻</span></div>
                <div class="address-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span>ragged://home</span><span aria-hidden="true">⌕</span></div>
                <span class="browser-control browser-menu" aria-hidden="true">···</span>
              </div>
            </div>

            <div class="browser-content">
              <div class="welcome-page">
                <div class="welcome-logo"><span>R</span></div>
                <h2>Welcome to<br /><span>Ragged</span></h2>
              </div>
            </div>

            <div class="browser-status"><span>Ragged Browser</span></div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
